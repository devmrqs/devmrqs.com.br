<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tema aplicado antes do React carregar (evita a piscada branca) -->
  <script>
    (function () {
      var theme = localStorage.getItem("theme") || "system";
      var prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches;
      if (theme === "dark" || (theme === "system" && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>

  <!-- Básico -->
  <title>Ângelo Ferreira | Desenvolvedor Front-end & Designer</title>
  <meta name="description"
    content="Portfólio de Ângelo M. Ferreira, desenvolvedor front-end e designer focado em interfaces animadas e interativas com React, GSAP e Tailwind CSS." />
  <meta name="author" content="Ângelo M. Ferreira" />
  <link rel="canonical" href="https://devmrqs.vercel.app/" />

  <!-- Cor da barra do navegador no celular -->
  <meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />

  <!-- Ícones -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph (WhatsApp, LinkedIn, Facebook, Discord) -->

  <meta property="og:site_name" content="Ângelo Ferreira" />
  <meta property="og:title" content="Ângelo Ferreira | Desenvolvedor Front-end & Designer" />

    content="Interfaces animadas e interativas com React, GSAP e Tailwind CSS. Confira meus projetos." />
  <meta property="og:url" content="https://devmrqs.vercel.app/" />
  <meta property="og:image" content="https://devmrqs.vercel.app/og-image.png" />

  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter / X -->
